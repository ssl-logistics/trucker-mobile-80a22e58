<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple Sign In - Redirecting...</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: #000;
        color: white;
      }
      .container {
        text-align: center;
        padding: 20px;
      }
      .spinner {
        border: 4px solid rgba(255,255,255,0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .debug {
        margin-top: 20px;
        font-size: 12px;
        background: rgba(255,255,255,0.1);
        padding: 10px;
        border-radius: 8px;
        word-break: break-all;
        max-width: 90vw;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="spinner"></div>
      <p>กำลังดำเนินการ Apple Sign In...</p>
      <div class="debug" id="debug"></div>
    </div>
    <script>
      (function () {
        var debugEl = document.getElementById('debug');
        function log(msg) {
          console.log('[Apple Callback HTML] ' + msg);
          debugEl.innerHTML += msg + '<br>';
        }

        log('URL: ' + window.location.href);

        // Supabase appends tokens as hash fragment after OAuth:
        // #access_token=xxx&refresh_token=xxx&expires_in=3600&token_type=bearer&type=signup
        var hash = window.location.hash;

        if (!hash || hash.length < 2) {
          log('No hash fragment found, checking query params...');
          // Sometimes Supabase sends error as query params
          var search = window.location.search;
          if (search) {
            var params = new URLSearchParams(search);
            var error = params.get('error');
            var errorDesc = params.get('error_description');
            if (error) {
              log('ERROR: ' + error + ' - ' + errorDesc);
              debugEl.innerHTML += '<br><strong style="color:#ff6b6b">เข้าสู่ระบบไม่สำเร็จ: ' + (errorDesc || error) + '</strong>';
              setTimeout(function() {
                window.location.href = '/';
              }, 3000);
              return;
            }
          }
          log('Waiting for redirect...');
          // May still be processing, wait a bit
          setTimeout(function() {
            log('Still no tokens, redirecting to app...');
            window.location.href = '/';
          }, 5000);
          return;
        }

        // Parse hash fragment
        var hashParams = new URLSearchParams(hash.substring(1));
        var accessToken = hashParams.get('access_token');
        var refreshToken = hashParams.get('refresh_token');
        var expiresIn = hashParams.get('expires_in');
        var tokenType = hashParams.get('token_type');

        log('Access token: ' + (accessToken ? accessToken.substring(0, 20) + '...' : 'NONE'));
        log('Refresh token: ' + (refreshToken ? 'YES' : 'NONE'));

        if (!accessToken) {
          log('ERROR: No access token in hash');
          debugEl.innerHTML += '<br><strong style="color:#ff6b6b">ไม่พบ token กรุณาลองใหม่</strong>';
          setTimeout(function() {
            window.location.href = '/';
          }, 3000);
          return;
        }

        // Build deep link URL to redirect back to native app
        var deepLinkUrl = 'thetroob://apple-auth-callback'
          + '?access_token=' + encodeURIComponent(accessToken)
          + '&refresh_token=' + encodeURIComponent(refreshToken || '')
          + '&expires_in=' + encodeURIComponent(expiresIn || '3600')
          + '&token_type=' + encodeURIComponent(tokenType || 'bearer');

        log('Redirecting to native app...');

        // Try to open the native app
        window.location.href = deepLinkUrl;

        // If still here after 2 seconds, fallback to web app
        setTimeout(function() {
          log('Deep link may not have worked, trying web fallback...');
          // Redirect to web app with tokens in hash (the Supabase client will pick them up)
          var webUrl = window.location.origin + '/' + hash;
          log('Web fallback: ' + webUrl);
          window.location.replace(webUrl);
        }, 2000);
      })();
    </script>
  </body>
</html>
