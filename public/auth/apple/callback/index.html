<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple Sign In</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #000;
        color: white;
        padding: 20px;
      }
      .container {
        text-align: center;
        max-width: 360px;
        width: 100%;
      }
      .spinner {
        border: 4px solid rgba(255,255,255,0.2);
        border-top: 4px solid white;
        border-radius: 50%;
        width: 48px;
        height: 48px;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 24px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      h2 { font-size: 20px; margin-bottom: 8px; }
      .subtitle { color: rgba(255,255,255,0.6); font-size: 14px; margin-bottom: 24px; }
      .open-btn {
        display: none;
        width: 100%;
        padding: 16px;
        font-size: 17px;
        font-weight: 600;
        border: none;
        border-radius: 14px;
        background: white;
        color: black;
        cursor: pointer;
        margin-bottom: 12px;
        -webkit-tap-highlight-color: transparent;
      }
      .open-btn:active { background: #e0e0e0; }
      .retry-btn {
        display: none;
        width: 100%;
        padding: 14px;
        font-size: 15px;
        font-weight: 500;
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 14px;
        background: transparent;
        color: white;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .error-msg {
        display: none;
        color: #ff6b6b;
        font-size: 14px;
        margin-top: 16px;
        padding: 12px;
        background: rgba(255,107,107,0.1);
        border-radius: 10px;
      }
      .debug {
        margin-top: 20px;
        font-size: 11px;
        color: rgba(255,255,255,0.3);
        word-break: break-all;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="spinner" id="spinner"></div>
      <h2>กำลังเข้าสู่ระบบ...</h2>
      <p class="subtitle" id="subtitle">กรุณารอสักครู่</p>
      
      <button class="open-btn" id="openBtn" onclick="openApp()">
        เปิดแอป The Troob Mobile
      </button>
      
      <button class="retry-btn" id="retryBtn" onclick="window.location.href='/'">
        กลับหน้าหลัก
      </button>
      
      <div class="error-msg" id="errorMsg"></div>
      <div class="debug" id="debug"></div>
    </div>

    <script>
      (function () {
        var debugEl = document.getElementById('debug');
        var openBtn = document.getElementById('openBtn');
        var retryBtn = document.getElementById('retryBtn');
        var spinner = document.getElementById('spinner');
        var subtitle = document.getElementById('subtitle');
        var errorMsg = document.getElementById('errorMsg');
        var deepLinkUrl = null;

        function log(msg) {
          console.log('[Apple Callback] ' + msg);
          debugEl.innerHTML += msg + '<br>';
        }

        function showError(msg) {
          spinner.style.display = 'none';
          errorMsg.textContent = msg;
          errorMsg.style.display = 'block';
          retryBtn.style.display = 'block';
        }

        function showOpenButton() {
          spinner.style.display = 'none';
          subtitle.textContent = 'กดปุ่มด้านล่างเพื่อกลับไปยังแอป';
          openBtn.style.display = 'block';
          retryBtn.style.display = 'block';
        }

        window.openApp = function() {
          if (deepLinkUrl) {
            log('User tapped open button');
            window.location.href = deepLinkUrl;
          }
        };

        log('URL: ' + window.location.href);

        var searchParams = new URLSearchParams(window.location.search);
        var hash = window.location.hash;
        var hashParams = new URLSearchParams(hash && hash.length > 1 ? hash.substring(1) : '');

        // Check provider error first
        var error = searchParams.get('error') || hashParams.get('error');
        var errorDesc = searchParams.get('error_description') || hashParams.get('error_description');
        if (error) {
          log('ERROR: ' + error + ' - ' + (errorDesc || ''));
          showError('เข้าสู่ระบบไม่สำเร็จ: ' + (errorDesc || error));
          return;
        }

        // Support both code flow and token flow
        var code = searchParams.get('code');
        var accessToken = hashParams.get('access_token') || searchParams.get('access_token');
        var refreshToken = hashParams.get('refresh_token') || searchParams.get('refresh_token');
        var expiresIn = hashParams.get('expires_in') || searchParams.get('expires_in');
        var tokenType = hashParams.get('token_type') || searchParams.get('token_type');

        if (code) {
          log('Auth code: YES (' + code.length + ' chars)');
          deepLinkUrl = 'thetroob://apple-auth-callback?code=' + encodeURIComponent(code);
        } else {
          log('Access token: ' + (accessToken ? 'YES (' + accessToken.length + ' chars)' : 'NONE'));
          log('Refresh token: ' + (refreshToken ? 'YES' : 'NONE'));

          if (!accessToken) {
            showError('ไม่พบ code หรือ token กรุณาลองใหม่อีกครั้ง');
            return;
          }

          // Build deep link URL for token flow
          deepLinkUrl = 'thetroob://apple-auth-callback'
            + '?access_token=' + encodeURIComponent(accessToken)
            + '&refresh_token=' + encodeURIComponent(refreshToken || '')
            + '&expires_in=' + encodeURIComponent(expiresIn || '3600')
            + '&token_type=' + encodeURIComponent(tokenType || 'bearer');
        }

        log('Attempting auto-redirect...');

        // Attempt 1: Try automatic redirect via custom URL scheme
        var iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = deepLinkUrl;
        document.body.appendChild(iframe);

        // Attempt 2: Also try direct location change after a brief delay
        setTimeout(function() {
          window.location.href = deepLinkUrl;
        }, 300);

        // Attempt 3: If still on this page after 2 seconds, show the button
        setTimeout(function() {
          // If we're still here, the auto-redirect didn't work
          log('Auto-redirect may have failed, showing button');
          showOpenButton();
        }, 2000);

        // Final fallback: after 10 seconds, offer web fallback
        setTimeout(function() {
          if (document.visibilityState !== 'hidden') {
            log('Still on page after 10s');
            // Try web app fallback with tokens in hash
            retryBtn.textContent = 'เข้าใช้งานผ่านเว็บ';
              retryBtn.onclick = function() {
                if (hash && hash.length > 1) {
                  window.location.replace(window.location.origin + '/' + hash);
                } else {
                  window.location.replace(window.location.origin + '/');
                }
              };
          }
        }, 10000);
      })();
    </script>
  </body>
</html>
