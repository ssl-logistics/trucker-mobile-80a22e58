<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LINE Callback - กลับเข้าแอป</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: #06C755;
        color: white;
        padding: 20px;
      }
      .container {
        text-align: center;
        max-width: 420px;
        width: 100%;
      }
      .check {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        background: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        color: #06C755;
        font-weight: bold;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { font-size: 15px; opacity: 0.95; margin: 4px 0 16px; line-height: 1.5; }
      .open-btn {
        display: block;
        margin: 24px auto 12px;
        padding: 18px 24px;
        background: white;
        color: #06C755;
        font-size: 18px;
        font-weight: bold;
        text-decoration: none;
        border-radius: 14px;
        border: none;
        cursor: pointer;
        width: 100%;
        max-width: 320px;
        box-shadow: 0 6px 16px rgba(0,0,0,0.2);
        transition: transform 0.1s;
        animation: pulse 2s ease-in-out infinite;
      }
      .open-btn:active { transform: scale(0.97); animation: none; }
      @keyframes pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 6px 16px rgba(0,0,0,0.2); }
        50% { transform: scale(1.03); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
      }
      .web-link {
        display: inline-block;
        margin-top: 8px;
        color: white;
        font-size: 13px;
        text-decoration: underline;
        opacity: 0.85;
      }
      .hint {
        margin-top: 16px;
        font-size: 12px;
        opacity: 0.8;
        line-height: 1.5;
      }
      .debug {
        margin-top: 20px;
        font-size: 10px;
        background: rgba(0,0,0,0.2);
        padding: 8px;
        border-radius: 8px;
        word-break: break-all;
        text-align: left;
        max-height: 100px;
        overflow: auto;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="check">✓</div>
      <h1>เข้าสู่ระบบ LINE สำเร็จ</h1>
      <p>กดปุ่มด้านล่างเพื่อกลับเข้าแอป The Trucker</p>

      <a id="openAppBtn" class="open-btn" href="#">📱 เปิดแอป The Trucker</a>
      <div class="hint">
        หากไม่เด้งกลับแอปอัตโนมัติ<br>กรุณากดปุ่มด้านบน
      </div>
      <a id="webFallback" class="web-link" href="#">หรือใช้งานต่อบนเว็บ</a>

      <div class="debug" id="debug"></div>
    </div>

    <script>
      (function () {
        var debugEl = document.getElementById('debug');
        function log(msg) {
          try { console.log('[LINE Callback HTML] ' + msg); } catch (e) {}
          debugEl.innerHTML += msg + '<br>';
        }

        var search = window.location.search || '';
        log('URL: ' + window.location.href);

        if (!search || search === '?') {
          log('ERROR: ไม่พบ code จาก LINE');
          document.querySelector('h1').textContent = 'เกิดข้อผิดพลาด';
          document.querySelector('p').textContent = 'ไม่พบ code จาก LINE — กลับไปหน้าเข้าสู่ระบบใน 3 วินาที';
          setTimeout(function () { window.location.href = '/'; }, 3000);
          return;
        }

        var urlParams = new URLSearchParams(search);
        var code = urlParams.get('code');
        var state = urlParams.get('state');
        log('Code: ' + (code ? code.substring(0, 16) + '...' : 'NONE'));
        log('State: ' + state);

        var ua = navigator.userAgent || '';
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        log('Platform: ' + (isAndroid ? 'Android' : isIOS ? 'iOS' : 'Other'));

        function toBase64Url(obj) {
          var json = JSON.stringify(obj || {});
          return btoa(unescape(encodeURIComponent(json)))
            .replace(/\+/g, '-')
            .replace(/\//g, '_')
            .replace(/=+$/g, '');
        }

        var payload = {};
        if (code) payload.code = code;
        if (state) payload.state = state;
        var encodedPayload = toBase64Url(payload);

        // Build deep link URLs — keep query version plus a path-payload fallback for Android WebView
        var customScheme = 'thetroob://line-callback' + search;
        var payloadScheme = 'thetroob://line-callback/payload/' + encodedPayload;

        // Android Intent URL — encode query into intent path so params survive the conversion
        // Use S.code / S.state extras as a backup so the app can read them even if query is dropped
        var intentExtras = '';
        if (code) intentExtras += 'S.code=' + encodeURIComponent(code) + ';';
        if (state) intentExtras += 'S.state=' + encodeURIComponent(state) + ';';
        var intentUrl = 'intent://line-callback' + search +
          '#Intent;scheme=thetroob;package=com.thetroob.mobile;' +
          intentExtras +
          'S.browser_fallback_url=' + encodeURIComponent(window.location.origin + '/#/auth/line/callback' + search) +
          ';end';

        // Prefer custom scheme on Android too — it preserves query string reliably for Capacitor appUrlOpen
        var deepLink = payloadScheme;
        log('Deep link: ' + deepLink.substring(0, 120));
        log('Fallback query link: ' + customScheme.substring(0, 120));
        log('Search preserved: ' + (search ? 'YES (' + search.length + ' chars)' : 'NO'));

        var openBtn = document.getElementById('openAppBtn');
        var webBtn = document.getElementById('webFallback');

        openBtn.href = deepLink;
        webBtn.href = window.location.origin + '/#/auth/line/callback' + search;

        // Track if user has interacted (helps with iOS Safari restrictions)
        var hasUserGesture = false;
        ['touchstart', 'click', 'keydown'].forEach(function (ev) {
          window.addEventListener(ev, function () { hasUserGesture = true; }, { once: true, passive: true });
        });

        // On Android: try auto-redirect immediately (Chrome handles intent:// well)
        // On iOS: do NOT auto-redirect (Safari blocks custom schemes without user gesture)
        //         Wait for user to tap the big button.
        if (isAndroid) {
          setTimeout(function () {
            log('Android auto-redirect to intent URL');
            try {
              window.location.href = deepLink;
            } catch (e) {
              log('Auto deep link failed: ' + e.message);
            }
          }, 500);
        } else if (isIOS) {
          // iOS: try one auto-attempt after a short delay (some in-app browsers allow it)
          // but rely primarily on the user tapping the button.
          setTimeout(function () {
            log('iOS auto-attempt deep link');
            try {
              window.location.href = deepLink;
            } catch (e) {
              log('Auto deep link blocked: ' + e.message);
            }
          }, 800);
        }

        // Bind click for explicit user gesture (most reliable)
        openBtn.addEventListener('click', function (e) {
          log('User tapped open-app button');
          // Let the default <a href> navigation happen — user gesture allows scheme launch
        });
      })();
    </script>
  </body>
</html>
