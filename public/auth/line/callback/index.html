<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LINE Callback - กลับเข้าแอป</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: #06C755;
        color: white;
        padding: 20px;
      }
      .container {
        text-align: center;
        max-width: 420px;
        width: 100%;
      }
      .check {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        background: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        color: #06C755;
        font-weight: bold;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { font-size: 15px; opacity: 0.95; margin: 4px 0 16px; line-height: 1.5; }
      .open-btn {
        display: block;
        margin: 24px auto 12px;
        padding: 18px 24px;
        background: white;
        color: #06C755;
        font-size: 18px;
        font-weight: bold;
        text-decoration: none;
        border-radius: 14px;
        border: none;
        cursor: pointer;
        width: 100%;
        max-width: 320px;
        box-shadow: 0 6px 16px rgba(0,0,0,0.2);
        transition: transform 0.1s;
        animation: pulse 2s ease-in-out infinite;
      }
      .open-btn:active { transform: scale(0.97); animation: none; }
      @keyframes pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 6px 16px rgba(0,0,0,0.2); }
        50% { transform: scale(1.03); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
      }
      .web-link {
        display: inline-block;
        margin-top: 8px;
        color: white;
        font-size: 13px;
        text-decoration: underline;
        opacity: 0.85;
      }
      .hint {
        margin-top: 16px;
        font-size: 12px;
        opacity: 0.8;
        line-height: 1.5;
      }
      .debug {
        margin-top: 20px;
        font-size: 10px;
        background: rgba(0,0,0,0.2);
        padding: 8px;
        border-radius: 8px;
        word-break: break-all;
        text-align: left;
        max-height: 100px;
        overflow: auto;
        opacity: 0.7;
      }
      .hidden { display: none !important; }
      .spinner {
        width: 34px;
        height: 34px;
        margin: 0 auto;
        border: 3px solid rgba(255,255,255,0.35);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="spinner" id="spinner"></div>

      <div id="fallbackUi" class="hidden">
        <div class="check">✓</div>
        <h1>เข้าสู่ระบบ LINE สำเร็จ</h1>
        <p>กดปุ่มด้านล่างเพื่อกลับเข้าแอป The Trucker</p>

        <a id="openAppBtn" class="open-btn" href="#">📱 เปิดแอป The Trucker</a>
        <div class="hint">
          หากไม่เด้งกลับแอปอัตโนมัติ<br>กรุณากดปุ่มด้านบน
        </div>
        <a id="webFallback" class="web-link" href="#">หรือใช้งานต่อบนเว็บ</a>
      </div>

      <div class="debug hidden" id="debug"></div>
    </div>


    <script>
      (function () {
        // Supabase project (Data API) — used to bridge the LINE code back to the app
        // in case Android intent:// hand-off doesn't work. The app polls this
        // table when its in-app browser closes and completes login from there.
        var SUPABASE_URL = 'https://yhzurkotubkkaokhtmsb.supabase.co';
        var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloenVya290dWJra2Fva2h0bXNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE3ODk1NTMsImV4cCI6MjA3NzM2NTU1M30.jBgmzgXtDJNBk2YxIIgOH5Ret74Lo-u5Nzkzci98F_Q';

        var debugEl = document.getElementById('debug');
        function log(msg) {
          try { console.log('[LINE Callback HTML] ' + msg); } catch (e) {}
          debugEl.innerHTML += msg + '<br>';
        }

        var search = window.location.search || '';
        log('URL: ' + window.location.href);

        if (!search || search === '?') {
          log('ERROR: ไม่พบ code จาก LINE');
          document.querySelector('h1').textContent = 'เกิดข้อผิดพลาด';
          document.querySelector('p').textContent = 'ไม่พบ code จาก LINE — กลับไปหน้าเข้าสู่ระบบใน 3 วินาที';
          setTimeout(function () { window.location.href = '/'; }, 3000);
          return;
        }

        var urlParams = new URLSearchParams(search);
        var code = urlParams.get('code');
        var state = urlParams.get('state');
        log('Code: ' + (code ? code.substring(0, 16) + '...' : 'NONE'));
        log('State: ' + state);

        var ua = navigator.userAgent || '';
        var isAndroid = /Android/i.test(ua);
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        log('Platform: ' + (isAndroid ? 'Android' : isIOS ? 'iOS' : 'Other'));

        function toBase64Url(obj) {
          var json = JSON.stringify(obj || {});
          return btoa(unescape(encodeURIComponent(json)))
            .replace(/\+/g, '-')
            .replace(/\//g, '_')
            .replace(/=+$/g, '');
        }

        // ── Bridge write: persist code+state so the app can pick it up on
        // browserFinished (needed for Android where intent:// often fails). ──
        var bridgePromise = null;
        if (code && state) {
          try {
            bridgePromise = fetch(SUPABASE_URL + '/rest/v1/line_pending_auth', {
              method: 'POST',
              headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                'Content-Type': 'application/json',
                'Prefer': 'return=minimal,resolution=merge-duplicates'
              },
              body: JSON.stringify({ state: state, code: code })
            }).then(function (r) {
              log('Bridge write: ' + r.status);
            }).catch(function (err) {
              log('Bridge write failed: ' + err.message);
            });
          } catch (err) {
            log('Bridge fetch threw: ' + err.message);
          }
        }

        var payload = {};
        if (code) payload.code = code;
        if (state) payload.state = state;
        var encodedPayload = toBase64Url(payload);

        // Build deep link URLs — use a path payload so Android browsers can't strip query params
        // before the app receives the callback.
        var payloadScheme = 'thetroob://line-callback/payload/' + encodedPayload;

        // Android Intent URL — keep the payload in the path, not in ?code=...&state=...
        // because some Android handoffs collapse the callback to plain `thetroob://line-callback`.
        var intentUrl = 'intent://line-callback/payload/' + encodedPayload +
          '#Intent;scheme=thetroob;package=com.thetroob.mobile;' +
          'S.browser_fallback_url=' + encodeURIComponent(window.location.origin + '/#/auth/line/callback' + search) +
          ';end';

        var deepLink = isAndroid ? intentUrl : payloadScheme;
        log('Deep link: ' + deepLink.substring(0, 120));

        var openBtn = document.getElementById('openAppBtn');
        var webBtn = document.getElementById('webFallback');
        var pEl = document.querySelector('p');

        openBtn.href = deepLink;
        openBtn.addEventListener('click', function (e) {
          log('User tapped open-app button');
          if (!isAndroid) return;
          e.preventDefault();
          // Try custom scheme first — with the bridge write in place the app
          // no longer needs the payload, so a plain scheme is enough to wake it.
          try { window.location.href = payloadScheme; } catch (err) { log('Scheme click failed: ' + err.message); }
          setTimeout(function () {
            if (document.visibilityState === 'visible') {
              log('Scheme did not open app, trying intent URL');
              try { window.location.href = intentUrl; } catch (err) { log('Intent click failed: ' + err.message); }
            }
          }, 650);
        });
        webBtn.href = window.location.origin + '/#/auth/line/callback' + search;

        // Update copy once the bridge write settles: user can just close the tab.
        function markBridgeReady() {
          if (pEl) {
            pEl.innerHTML = 'ปิดหน้านี้เพื่อกลับเข้าแอป The Trucker<br>หรือกดปุ่มด้านล่าง';
          }
        }
        if (bridgePromise) {
          bridgePromise.then(markBridgeReady, markBridgeReady);
        }

        // Auto-attempt deep link (Android/iOS) — best-effort, harmless if blocked.
        if (isAndroid) {
          setTimeout(function () {
            log('Android auto-attempt scheme');
            try { window.location.href = payloadScheme; } catch (e) { log('Auto scheme failed: ' + e.message); }
          }, 500);
        } else if (isIOS) {
          setTimeout(function () {
            log('iOS auto-attempt deep link');
            try { window.location.href = deepLink; } catch (e) { log('Auto deep link blocked: ' + e.message); }
          }, 800);
        }
      })();
    </script>
  </body>
</html>
