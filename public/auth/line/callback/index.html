<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LINE Callback - Redirecting...</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: #06C755;
        color: white;
      }
      .container {
        text-align: center;
        padding: 20px;
      }
      .spinner {
        border: 4px solid rgba(255,255,255,0.3);
        border-top: 4px solid white;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .debug {
        margin-top: 20px;
        font-size: 12px;
        background: rgba(0,0,0,0.2);
        padding: 10px;
        border-radius: 8px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="spinner"></div>
      <p>กำลังดำเนินการ LINE Login...</p>
      <div class="debug" id="debug"></div>
    </div>
    <script>
      // LINE redirects here with ?code=...&state=...
      // Check if native app can handle this - try deep link first
      (function () {
        var debugEl = document.getElementById('debug');
        function log(msg) {
          console.log('[LINE Callback HTML] ' + msg);
          debugEl.innerHTML += msg + '<br>';
        }
        
        log('URL: ' + window.location.href);
        log('Search: ' + window.location.search);
        
        var search = window.location.search || "";
        
        if (!search || search === '?') {
          log('ERROR: No query params found!');
          debugEl.innerHTML += '<br><strong style="color:red">ไม่พบ code จาก LINE กรุณาลองใหม่</strong>';
          setTimeout(function() {
            window.location.href = '/';
          }, 3000);
          return;
        }
        
        // Extract code and state from URL
        var urlParams = new URLSearchParams(search);
        var code = urlParams.get('code');
        var state = urlParams.get('state');
        
        log('Code: ' + (code ? code.substring(0, 20) + '...' : 'NONE'));
        log('State: ' + state);
        
        // Try to redirect to native app first using custom URL scheme
        // This will work if the app is installed
        var deepLinkUrl = 'thetroob://line-callback' + search;
        log('Trying deep link: ' + deepLinkUrl);
        
        // Set a flag to track if we've been redirected
        var redirected = false;
        
        // Try opening the native app
        window.location.href = deepLinkUrl;
        
        // If still here after 1.5 seconds, fallback to web app (HashRouter)
        setTimeout(function() {
          if (!redirected) {
            log('Deep link did not work, falling back to web...');
            var newUrl = window.location.origin + "/#/auth/line/callback" + search;
            log('Redirecting to: ' + newUrl);
            window.location.replace(newUrl);
          }
        }, 1500);
      })();
    </script>
  </body>
</html>
